<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>College Sports Duel</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #080b12;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 700px;
        }

        .trophy {
            font-size: 70px;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 20px;
            color: #b8beca;
            margin-bottom: 40px;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 350px;
            margin: auto;
        }

        button {
            padding: 18px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .create {
            background: #ffffff;
            color: #080b12;
        }

        .join {
            background: transparent;
            color: white;
            border: 2px solid #ffffff;
        }

        button:hover {
            transform: scale(1.03);
        }

        .sports {
            margin-top: 45px;
            font-size: 18px;
            color: #8f96a3;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="trophy">🏆</div>

        <h1>COLLEGE SPORTS DUEL</h1>

        <div class="subtitle">
            BOWLS & BRACKETS
        </div>

        <div class="buttons">

            <button class="create" onclick="createRoom()">
                CREATE ROOM
            </button>

            <button class="join" onclick="joinRoom()">
                JOIN ROOM
            </button>

        </div>

        <div class="sports">
            🏈 College Football &nbsp;&nbsp; 🏀 March Madness
        </div>

    </div>

    <script>

        function createRoom() {
            alert("Room creation coming next!");
        }

        function joinRoom() {
            alert("Room joining coming next!");
        }

    </script>

</body>
</html>
